{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hotel-booking.componentName" (dict "root" $ "component" $name) }}
  labels:
    {{- include "hotel-booking.labels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  type: {{ $svc.service.type }}
  selector:
    {{- include "hotel-booking.selectorLabels" (dict "root" $ "component" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
{{- end }}
