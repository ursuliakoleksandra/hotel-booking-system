{{- range $name, $svc := .Values.services }}
{{- $comp := include "hotel-booking.componentName" (dict "root" $ "component" $name) }}
{{- $pg := include "hotel-booking.componentName" (dict "root" $ "component" "postgres") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $comp }}
  labels:
    {{- include "hotel-booking.labels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "hotel-booking.selectorLabels" (dict "root" $ "component" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hotel-booking.selectorLabels" (dict "root" $ "component" $name) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/app-configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/app-secret.yaml") $ | sha256sum }}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: {{ include "hotel-booking.imageRef" $.Values.postgres.image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ $pg }} -p {{ $.Values.postgres.port }} -U {{ $.Values.postgres.user }}; do echo "waiting for postgres"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: {{ $name }}
          image: {{ include "hotel-booking.image" (dict "root" $ "image" $svc.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ $comp }}-config
            - secretRef:
                name: {{ $comp }}-secret
          env:
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ $.Values.javaOpts | quote }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
{{- end }}
