{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hotel-booking.componentName" (dict "root" $ "component" $name) }}-secret
  labels:
    {{- include "hotel-booking.labels" (dict "root" $ "component" $name) | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ $.Values.secrets.dbPassword | quote }}
{{- end }}
