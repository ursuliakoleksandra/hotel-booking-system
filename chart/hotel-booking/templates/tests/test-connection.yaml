{{- $ui := include "hotel-booking.componentName" (dict "root" . "component" "ui") }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hotel-booking.fullname" . }}-test
  labels:
    {{- include "hotel-booking.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: {{ include "hotel-booking.imageRef" .Values.testImage }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - sh
        - -c
        - |
          set -e
          base=http://{{ $ui }}:{{ .Values.ui.service.port }}
          wget -q -O /dev/null $base/healthz
          echo "OK /healthz"
          wget -q -O /dev/null $base/version.json
          echo "OK /version.json"
          {{- range $name, $svc := .Values.services }}
          wget -q -O /dev/null $base{{ $svc.apiPath }}
          echo "OK {{ $svc.apiPath }}"
          {{- end }}
