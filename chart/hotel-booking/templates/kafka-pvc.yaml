{{- if .Values.kafka.persistence.enabled }}
{{- $kafka := include "hotel-booking.componentName" (dict "root" . "component" "kafka") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $kafka }}-data
  labels:
    {{- include "hotel-booking.labels" (dict "root" . "component" "kafka") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.kafka.persistence.storageClass }}
  storageClassName: {{ .Values.kafka.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.kafka.persistence.size }}
{{- end }}
