{{- $ui := include "hotel-booking.componentName" (dict "root" . "component" "ui") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $ui }}-config
  labels:
    {{- include "hotel-booking.labels" (dict "root" . "component" "ui") | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      add_header X-Pod $hostname always;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header X-Pod $hostname always;
      }
    {{- range $name, $svc := .Values.services }}

      location {{ $svc.apiPath }} {
        proxy_pass http://{{ include "hotel-booking.componentName" (dict "root" $ "component" $name) }}:{{ $svc.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
      }
    {{- end }}
    }
