{{- if .Values.postgres.persistence.enabled }}
{{- $pg := include "hotel-booking.componentName" (dict "root" . "component" "postgres") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pg }}-data
  labels:
    {{- include "hotel-booking.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgres.persistence.storageClass }}
  storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}
