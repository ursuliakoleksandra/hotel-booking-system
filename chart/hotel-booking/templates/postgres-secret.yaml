{{- $pg := include "hotel-booking.componentName" (dict "root" . "component" "postgres") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pg }}-secret
  labels:
    {{- include "hotel-booking.labels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
