# DVO-L3-7F2A91
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
  namespace: hotel-booking
  labels:
    app: ui
    app.kubernetes.io/part-of: hotel-booking-system
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      add_header X-Pod $hostname always;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header X-Pod $hostname always;
      }

      location /api/v1/users {
        proxy_pass http://user-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
      }

      location /api/v1/hotels {
        proxy_pass http://hotel-management:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
      }

      location /api/v1/bookings {
        proxy_pass http://booking-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
      }
    }
